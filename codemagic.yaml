workflows:
  # ★ Apple Developer登録後にこちらを使う（今はコメントアウト）
  # ios-testflight:
  #   name: WalkPacer iOS → TestFlight
  #   ...

  ios-build-check:
    name: WalkPacer ビルド確認（署名なし）
    max_build_duration: 30
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: claude/*
          include: true

    environment:
      vars:
        XCODE_PROJECT: WalkPacer/WalkPacer.xcodeproj
        XCODE_SCHEME: WalkPacer
      xcode: latest

    scripts:
      - name: Xcodeビルド（署名なし・コンパイル確認のみ）
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

    artifacts:
      - /tmp/xcodebuild_logs/*.log
